services:
  app:
    image: ${APP_IMAGE:-ghcr.io/guohai163/s3-obj-backup:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://s3backup:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/s3backup?sslmode=disable}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      VIEWER_USER: ${VIEWER_USER:-}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    stop_grace_period: 30s
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: s3backup
      POSTGRES_DB: s3backup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3backup -d s3backup"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  pgdata:
