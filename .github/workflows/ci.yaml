name: Build and publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish (for example, v0.1.0)"
        required: true
        type: string
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !inputs.release_tag && github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: s3backup
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: s3backup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s3backup"
          --health-interval 5s --health-timeout 4s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://s3backup:integration-test@localhost:5432/s3backup?sslmode=disable
    steps:
      - name: Validate release tag
        if: env.RELEASE_TAG != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag such as v0.1.0."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start MinIO
        run: |
          set -eux
          release=RELEASE.2025-09-07T16-13-09Z
          file=minio.linux-amd64.$release
          base=https://github.com/minio/minio/releases/download/$release
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/$file.sha256sum"
          echo "$(cut -d ' ' -f 1 "$file.sha256sum")  $file" | sha256sum --check
          chmod +x "$file"
          mkdir "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=integration MINIO_ROOT_PASSWORD=integration-test "./$file" server \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 "$RUNNER_TEMP/minio-data" >"$RUNNER_TEMP/minio.log" 2>&1 &
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:9000/minio/health/live
      - name: Test and lint
        env:
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_ACCESS_KEY: integration
          TEST_S3_SECRET_KEY: integration-test
        run: |
          go vet ./...
          go test -race -v ./...
          node --check internal/backup/web/i18n.js
          node --check internal/backup/web/app.js

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke test container
        run: |
          docker buildx build --load --tag s3-obj-backup:ci .
          docker network create smoke
          docker run -d --name smoke-db --network smoke -e POSTGRES_PASSWORD=smoke-test-only postgres:17-alpine
          for attempt in $(seq 30); do
            if docker exec smoke-db pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker run -d --name smoke-app --network smoke -p 127.0.0.1:8080:8080 \
            -e 'DATABASE_URL=postgresql://postgres:smoke-test-only@smoke-db/postgres?sslmode=disable' \
            -e ADMIN_USER=admin -e ADMIN_PASSWORD=smoke-test-only \
            -e APP_ENCRYPTION_KEY="$(openssl rand -base64 32)" s3-obj-backup:ci
          if ! curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz; then
            docker logs smoke-app
            exit 1
          fi
      - name: Package public release downloads
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in amd64 arm64; do
            file="s3-obj-backup-linux-$arch.tar"
            docker buildx build --platform "linux/$arch" --provenance=false \
              --output "type=docker,dest=$file" --tag "$IMAGE:latest" --tag "$IMAGE:$RELEASE_TAG" .
            gzip "$file"
          done
          sha256sum s3-obj-backup-linux-*.tar.gz > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" s3-obj-backup-linux-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes s3-obj-backup-linux-*.tar.gz SHA256SUMS
          fi
      - uses: docker/login-action@v3
        if: env.RELEASE_TAG != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish to GHCR
        if: env.RELEASE_TAG != ''
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:latest" .
